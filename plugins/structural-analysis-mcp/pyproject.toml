[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structural-mcp"
version = "0.1.0"
description = "MCP servers for LIRA-SAPR, SAPFIR, STAAD.Pro and SAP2000 (local Windows COM adapters)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2,<3",
    "anyio>=4",
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
structural-mcp = "structural_mcp.cli:main"
sap2000-mcp = "structural_mcp.cli:sap2000"
staad-mcp = "structural_mcp.cli:staad"
lira-mcp = "structural_mcp.cli:lira"
sapfir-mcp = "structural_mcp.cli:sapfir"

[tool.hatch.build.targets.wheel]
packages = ["src/structural_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
